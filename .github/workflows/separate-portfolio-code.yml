name: Separate Portfolio Code

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  separate-code:
    if: github.event.head_commit.message != 'Separate portfolio code into HTML CSS JS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move inline CSS and JavaScript into dedicated files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          css = Path('css/style.css')
          js = Path('js/script.js')

          html = index.read_text(encoding='utf-8')
          css_text = css.read_text(encoding='utf-8')
          js_text = js.read_text(encoding='utf-8')

          styles = re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>', html, flags=re.I | re.S)
          scripts = re.findall(r'<script(?![^>]*\bsrc\s*=)(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I | re.S)

          if styles:
              additions = '\n\n/* INLINE PORTFOLIO CSS MOVED FROM index.html */\n' + '\n\n'.join(s.strip() for s in styles if s.strip()) + '\n'
              if additions.strip() not in css_text:
                  css_text = css_text.rstrip() + additions
              html = re.sub(r'<style(?:\s[^>]*)?>.*?</style>', '', html, flags=re.I | re.S)

          if scripts:
              additions = '\n\n/* INLINE PORTFOLIO JAVASCRIPT MOVED FROM index.html */\n' + '\n\n'.join(s.strip() for s in scripts if s.strip()) + '\n'
              if additions.strip() not in js_text:
                  js_text = js_text.rstrip() + additions
              html = re.sub(r'<script(?![^>]*\bsrc\s*=)(?:\s[^>]*)?>.*?</script>', '', html, flags=re.I | re.S)

          if scripts and not re.search(r'<script\s+[^>]*src=["\'](?:\./)?js/script\.js(?:\?[^"\']*)?["\']', html, flags=re.I):
              html = re.sub(r'</body>', '  <script src="js/script.js"></script>\n</body>', html, count=1, flags=re.I)

          index.write_text(html, encoding='utf-8')
          css.write_text(css_text + ('\n' if not css_text.endswith('\n') else ''), encoding='utf-8')
          js.write_text(js_text + ('\n' if not js_text.endswith('\n') else ''), encoding='utf-8')
          PY

      - name: Verify separation
        run: |
          ! grep -n '<style' index.html
          ! grep -n '<script' index.html | grep -v 'src="js/script.js"'
          grep -q 'stylesheet' index.html
          grep -q 'src="js/script.js"' index.html

      - name: Commit separated files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/style.css js/script.js
          if git diff --cached --quiet; then
            echo "No separation changes needed."
            exit 0
          fi
          git commit -m "Separate portfolio code into HTML CSS JS"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --soft origin/main; git add index.html css/style.css js/script.js; git commit -m "Separate portfolio code into HTML CSS JS"; }
            if git push origin HEAD:main; then
              echo "Portfolio code separation pushed successfully."
              exit 0
            fi
            echo "Push race detected; retrying ($attempt/8)..."
            sleep 2
          done
          echo "Could not push after 8 attempts."
          exit 1
