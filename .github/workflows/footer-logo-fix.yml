name: Footer Logo Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-footer-logo:
    if: github.event.head_commit.message != 'Fix footer logo only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace footer brand with logo mark only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="#home" class="brand-lockup footer-brand"><span class="brand-mark">E</span><span class="brand-name">DRAD</span></a>'
          new = '<a href="#home" class="brand-lockup footer-brand" aria-label="EDRAD home"><span class="brand-mark">E</span></a>'
          if old not in s:
              raise SystemExit('Footer brand markup not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit footer logo change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix footer logo only"
          git push
