name: Add EDRAD Hero Statement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-hero-statement:
    if: github.event.head_commit.message != 'Add EDRAD hero statement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert EDRAD philosophy statement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = 'Connecting engineering thinking with digital solutions.'
          if marker in s:
              print('Statement already present')
              raise SystemExit(0)

          headline = 'I build digital experiences that feel alive.'
          pattern = re.compile(r'(<(?:h1|h2|div|p)[^>]*>\s*' + re.escape(headline) + r'\s*</(?:h1|h2|div|p)>)', re.I)
          m = pattern.search(s)
          if not m:
              raise SystemExit('Hero headline not found')

          statement = '''\n<div class="edrad-philosophy" aria-label="EDRAD philosophy">\n  <span class="edrad-philosophy-title">ENGINEERING DIGITAL RESOURCES, APPLICATIONS &amp; DEVELOPMENT</span>\n  <span class="edrad-philosophy-line">Connecting engineering thinking with digital solutions.</span>\n</div>'''
          s = s[:m.end()] + statement + s[m.end():]

          css = '''\n<style id="edrad-philosophy-style">\n.edrad-philosophy{margin:1.15rem 0 1.35rem;max-width:760px;padding-left:1rem;border-left:2px solid rgba(217,255,87,.7);display:flex;flex-direction:column;gap:.38rem}\n.edrad-philosophy-title{font:700 .72rem/1.35 'DM Mono',monospace;letter-spacing:.105em;color:var(--text);opacity:.92}\n.edrad-philosophy-line{font:400 .9rem/1.5 Manrope,sans-serif;letter-spacing:.01em;color:#9a9a9e}\n@media(max-width:600px){.edrad-philosophy{margin:.9rem 0 1.15rem;padding-left:.75rem}.edrad-philosophy-title{font-size:.58rem;letter-spacing:.075em}.edrad-philosophy-line{font-size:.78rem}}\n</style>\n'''
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit hero statement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add EDRAD hero statement"
          git push
