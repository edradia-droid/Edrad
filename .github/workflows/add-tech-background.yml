name: Add Tech Background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-tech-background:
    if: github.event.head_commit.message != 'Apply faded tech background'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build subtle tech background and inject styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html

          root = Path('.')
          asset = root / 'assets' / 'tech-background.svg'
          asset.parent.mkdir(parents=True, exist_ok=True)

          labels = [
              ('HTML5', 90, 120, -8), ('CSS3', 410, 90, 7), ('JAVASCRIPT', 760, 150, -5),
              ('PYTHON', 1060, 82, 8), ('REACT', 1240, 260, -7), ('NODE.JS', 250, 390, 6),
              ('GITHUB', 600, 360, -5), ('API', 930, 410, 8), ('SQL', 1160, 510, -6),
              ('SUPABASE', 180, 620, -7), ('JSON', 500, 590, 6), ('GIT', 850, 650, -8),
              ('DATABASE', 1040, 720, 5), ('CLOUD', 1320, 640, -6), ('</>', 720, 790, 5),
              ('01', 70, 820, -5), ('{ }', 390, 760, 7), ('[ ]', 970, 860, -5)
          ]
          text_nodes = '\n'.join(
              f'<text x="{x}" y="{y}" transform="rotate({r} {x} {y})">{html.escape(t)}</text>'
              for t, x, y, r in labels
          )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
            <defs>
              <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
                <path d="M60 0H0V60" fill="none" stroke="#d9ff57" stroke-opacity=".075" stroke-width="1"/>
              </pattern>
              <radialGradient id="glow" cx="50%" cy="45%" r="65%">
                <stop offset="0" stop-color="#d9ff57" stop-opacity=".055"/>
                <stop offset=".55" stop-color="#d9ff57" stop-opacity=".012"/>
                <stop offset="1" stop-color="#000" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="1440" height="900" fill="url(#grid)"/>
            <rect width="1440" height="900" fill="url(#glow)"/>
            <g fill="#e8e8e8" fill-opacity=".075" font-family="monospace" font-size="34" font-weight="700" letter-spacing="2">
              {text_nodes}
            </g>
            <g fill="none" stroke="#d9ff57" stroke-opacity=".045" stroke-width="1">
              <path d="M80 250 C250 160 320 300 470 220 S760 170 900 260 1170 180 1370 290"/>
              <path d="M30 540 C220 450 350 570 520 500 S820 430 990 550 1210 470 1410 530"/>
              <circle cx="260" cy="250" r="90"/><circle cx="1120" cy="350" r="120"/><circle cx="730" cy="610" r="105"/>
            </g>
          </svg>'''
          asset.write_text(svg, encoding='utf-8')

          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')
          marker = 'tech-bg-layer'
          if marker not in s:
              css = '''\n<style id="tech-bg-layer">\nhtml,body{background:#080809!important}\nbody{position:relative;isolation:isolate}\nbody:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:url("assets/tech-background.svg") center top/cover repeat-y;opacity:.62;filter:saturate(.72) contrast(.92)}\nbody:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 35%,rgba(8,8,9,.08),rgba(8,8,9,.78) 78%),linear-gradient(180deg,rgba(8,8,9,.28),rgba(8,8,9,.62));backdrop-filter:blur(.25px)}\nmain,.navbar,footer{position:relative;z-index:0}\n@media(max-width:700px){body:before{background-size:auto 900px;opacity:.42}body:after{background:linear-gradient(180deg,rgba(8,8,9,.42),rgba(8,8,9,.76))}}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit background
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/tech-background.svg
          git commit -m "Apply faded tech background"
          git push
