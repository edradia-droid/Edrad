name: Set footer brand to logo only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  footer-logo:
    if: github.event.head_commit.message != 'Set footer brand logo only'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add footer logo-only rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/style.css')
          s = p.read_text(encoding='utf-8')
          rule = '\n/* Footer: show the EDRAD brand logo alone. */\n.footer-brand .brand-name{display:none!important}\n'
          if '.footer-brand .brand-name{display:none!important}' not in s:
              p.write_text(s.rstrip() + rule, encoding='utf-8')
          PY

      - name: Commit footer logo change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          git diff --cached --quiet && exit 0
          git commit -m "Set footer brand logo only"
          git push
