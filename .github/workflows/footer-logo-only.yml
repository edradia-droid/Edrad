name: Set footer brand to logo only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  footer-logo:
    if: github.event.head_commit.message != 'Set footer brand logo only'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hide footer brand text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/style.css')
          s = p.read_text(encoding='utf-8')
          old = ".footer-brand .brand-name{font-size:1.05rem}"
          new = ".footer-brand .brand-name{display:none}"
          if old not in s:
              raise SystemExit('Target footer brand rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit footer logo change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          git diff --cached --quiet && exit 0
          git commit -m "Set footer brand logo only"
          git push
